name: CloudShip CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      fail_ci_demo:
        description: "Demonstrate a failing test blocking deployment"
        type: boolean
        required: false
        default: false

# Testing only needs permission to read the repository.
permissions:
  contents: read

# Keep releases from overlapping; allow an active deployment to finish.
concurrency:
  group: cloudship-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Application tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      ALLOW_FAILURE_DEMO: "false"
      SIMULATE_UNHEALTHY: "false"

    steps:
      # Pin actions to reviewed release commits.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check dependency compatibility
        run: python -m pip check
    
          # Create a failing test only when explicitly requested manually.
      - name: Prepare CI failure demonstration
        if: github.event_name == 'workflow_dispatch' && inputs.fail_ci_demo
        shell: bash
        run: |
          printf '%s\n' \
            'def test_ci_gate_demo():' \
            '    assert False, "Intentional CI gate demonstration"' \
            > tests/test_ci_gate_demo.py

      - name: Run application tests
        run: python -m pytest -q


  build_publish:
    name: Build and publish image

    # Failed tests prevent image publication.
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    # Retain the image reference and digest for our later deployment job.
    outputs:
      image: ${{ steps.image.outputs.ref }}
      digest: ${{ steps.build.outputs.digest }}

    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Define release image
        id: image
        shell: bash
        run: |
          echo "ref=ghcr.io/jnanasagara/cloudship:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # GitHub supplies this token automatically; no personal token is needed.
      - name: Sign in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.image.outputs.ref }}
          labels: |
            org.opencontainers.image.source=https://github.com/Jnanasagara/cloudship
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    name: Deploy to EC2
    needs: build_publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    # Only this job can request an AWS OIDC token.
    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      APP_VERSION: ${{ github.sha }}

      # Deploy the exact published content, rather than resolving a mutable tag.
      IMAGE_REF: ghcr.io/jnanasagara/cloudship@${{ needs.build_publish.outputs.digest }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      # Exchange GitHub's identity token for temporary AWS credentials.
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: cloudship-${{ github.run_id }}
          role-duration-seconds: 1800
          mask-aws-account-id: true
          unset-current-credentials: true
          retry-max-attempts: 3
          action-timeout-s: 120

      - name: Check AWS CLI availability
        run: aws --version

      - name: Deploy and verify through SSM
        run: python scripts/deploy_ssm.py